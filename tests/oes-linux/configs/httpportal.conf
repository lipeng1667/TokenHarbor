# Isolated functional-test template; changing cwd does not relocate this file.
# Legacy config lookup uses /proc/self/exe's real directory. Deployment must
# expose httpportal.conf there (for example a root-owned link to the active run).
# Relative logs and pending-notification files also default to the executable dir.
# Runtime replaces __OES_TEST_NODE_DIR__ with this run's absolute node directory,
# provides links for fixed persistence filenames, replaces the DB password
# placeholder, and restricts this file to mode 0600.
[system]
ipc_id = 19000011
portal_id = 0
max_fd = 256
max_user = 512
max_notify_queue = 16
backlog = 128
listen_ip = 127.0.0.1
listen_port = 19011
kernel_ip = 127.0.0.1
kernel_port = 19009
kernel_timeout = 30
http_timeout = 15
timetick_range = 3600
max_socket_buffer = 8192
support_custom_order_id = 1
support_multi_service = 1
support_multi_function = 1
http_limit_ratio = 1
http_content_type = 1
if_savelog = 1
log_filename = __OES_TEST_NODE_DIR__/portal_log_
log_interval = 86400
log_maxsize = 1048576
log_cachesize = 4096

[database]
if_enable_db = 1
db_host = 127.0.0.1
db_port = 19306
db_name = oes_functional
db_user = oes_test
db_pass = __OES_TEST_DB_PASSWORD__
table_company = oes_company
table_ipauth = oes_auth_ip

[service]
0 = 0,0,--------------------------,,
1 = 0,1,--------------------------,,

[global param]
api_url = /api
query_url = /query
account_url = /account
