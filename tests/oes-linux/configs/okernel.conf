# Isolated functional-test template; changing cwd does not relocate this file.
# Legacy config lookup uses /proc/self/exe's real directory. Deployment must
# expose okernel.conf there (for example a root-owned link to the active run).
# Relative logs and order-history files also default to that executable directory.
# Runtime replaces __OES_TEST_NODE_DIR__ with this run's absolute node directory,
# provides links for fixed persistence filenames, replaces the DB password
# placeholder, and restricts this file to mode 0600.
[system]
ipc_id = 19000009
max_fd = 256
max_user = 512
max_portal = 2
max_dispatcher = 2
max_service = 1
order_queue = 1024
listen_ip = 127.0.0.1
listen_port = 19009
loop_port = 19100
web_ip = 127.0.0.1
timeout = 30
timetick_range = 3600
deny_order_history = 0
max_socket_buffer = 8192
if_savelog = 1
log_filename = __OES_TEST_NODE_DIR__/kernel_log_
log_interval = 86400
log_maxsize = 1048576
log_cachesize = 4096
cdr_filename = __OES_TEST_NODE_DIR__/kernel_cdr_
cdr_interval = 600
cdr_maxsize = 1048576
cdr_cachesize = 4096

[database]
if_enable_db = 1
db_host = 127.0.0.1
db_port = 19306
db_name = oes_functional
db_user = oes_test
db_pass = __OES_TEST_DB_PASSWORD__
db_pool_size = 1
db_update_interval = 1
db_update_delay = 0
table_company = oes_company
table_price = oes_price
table_stat = oes_stat_dispatcher
